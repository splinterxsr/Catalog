name: CI/CD Pipeline - Catalog (API & Worker)

on:
  push:
    branches:
      - cloud
  pull_request:
    branches:
      - cloud
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Tests (.NET 10)
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:19.03.12-dind
        options: --privileged
        ports:
          - 2375:2375

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test --no-build --configuration Release --verbosity normal
        env:
          DOCKER_HOST: tcp://localhost:2375

  deploy:
    name: Build Docker Images & Deploy to AKS
    needs: build-and-test
    if: github.ref == 'refs/heads/cloud' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v2.2.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry (ACR)
        run: |
          az acr login --name fiapcg

      - name: Build and Push Catalog.Api Docker Image
        run: |
          REGISTRY_URL=fiapcg.azurecr.io
          docker build -f Catalog.Api/Dockerfile -t $REGISTRY_URL/catalog-api:${{ github.sha }} -t $REGISTRY_URL/catalog-api:latest .
          docker push $REGISTRY_URL/catalog-api:${{ github.sha }}
          docker push $REGISTRY_URL/catalog-api:latest

      - name: Build and Push Catalog.Worker Docker Image
        run: |
          REGISTRY_URL=fiapcg.azurecr.io
          docker build -f Catalog.Worker/Dockerfile -t $REGISTRY_URL/catalog-worker:${{ github.sha }} -t $REGISTRY_URL/catalog-worker:latest .
          docker push $REGISTRY_URL/catalog-worker:${{ github.sha }}
          docker push $REGISTRY_URL/catalog-worker:latest    

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy Catalog.API to K8s
        run: |
          REGISTRY_URL=fiapcg.azurecr.io
          sed -i "s|image: .*catalog-api:.*|image: $REGISTRY_URL/catalog-api:${{ github.sha }}|g" Catalog.Api/k8s/catalog-api-deployment.yaml
          kubectl apply --validate=false -f Catalog.Api/k8s/
          kubectl rollout status deployment/catalog-api --timeout=120s || true

      - name: Deploy Catalog.Worker to K8s
        run: |
          REGISTRY_URL=fiapcg.azurecr.io
          sed -i "s|image: .*catalog-worker:.*|image: $REGISTRY_URL/catalog-worker:${{ github.sha }}|g" Catalog.Worker/k8s/catalog-worker-deployment.yaml
          kubectl apply --validate=false -f Catalog.Worker/k8s/
          kubectl rollout status deployment/catalog-worker --timeout=120s || true
