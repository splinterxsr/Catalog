apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-worker
  labels:
    app: catalog-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-worker
  template:
    metadata:
      labels:
        app: catalog-worker
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: catalog-worker
          image: fcgpostech.azurecr.io/catalog-worker:v1
          imagePullPolicy: Always
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"             

            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_HOST

            - name: PAYMENTS_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PAYMENTS_TOPIC

            - name: PAYMENTS_SUBSCRIPTION
              valueFrom:
                configMapKeyRef:
                  name: catalog-worker-config
                  key: PAYMENTS_SUBSCRIPTION

            - name: MONGODB_DB
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MONGODB_DB

            - name: KeyVaultUri
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KeyVaultUri

            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AZURE_TENANT_ID

            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AZURE_CLIENT_ID

            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AZURE_CLIENT_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"