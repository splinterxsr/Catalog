name: CI/CD Pipeline - Catalog (API & Worker)

on:
  push:
    branches:
      - cloud
  pull_request:
    branches:
      - cloud
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Unit Tests (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test --no-build --configuration Release --verbosity normal

  deploy:
    name: Build Docker Images & Deploy to AKS
    needs: build-and-test
    if: github.ref == 'refs/heads/cloud' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Autenticação na Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 2. Login no ACR
      - name: Login to Azure Container Registry (ACR)
        run: |
          az acr login --name fcgpostech

      # 3. Build & Push da Imagem da Catalog.API
      - name: Build and Push Catalog.API Docker Image
        run: |
          REGISTRY_URL=fcgpostech.azurecr.io
          docker build -f Catalog.API/Dockerfile -t $REGISTRY_URL/catalog-api:${{ github.sha }} -t $REGISTRY_URL/catalog-api:latest .
          docker push $REGISTRY_URL/catalog-api:${{ github.sha }}
          docker push $REGISTRY_URL/catalog-api:latest

      # 4. Build & Push da Imagem do Catalog.Worker
      - name: Build and Push Catalog.Worker Docker Image
        run: |
          REGISTRY_URL=fcgpostech.azurecr.io
          docker build -f Catalog.Worker/Dockerfile -t $REGISTRY_URL/catalog-worker:${{ github.sha }} -t $REGISTRY_URL/catalog-worker:latest .
          docker push $REGISTRY_URL/catalog-worker:${{ github.sha }}
          docker push $REGISTRY_URL/catalog-worker:latest
          
      # 5. Configurar contexto do AKS
      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      # 6. Deploy da API no Kubernetes
      - name: Deploy Catalog.API to K8s
        run: |
          REGISTRY_URL=fcgpostech.azurecr.io
          kubectl set image deployment/catalog-api catalog-api=$REGISTRY_URL/catalog-api:${{ github.sha }}
          kubectl rollout status deployment/catalog-api --timeout=120s

      # 7. Deploy do Worker no Kubernetes
      - name: Deploy Catalog.Worker to K8s
        run: |
          REGISTRY_URL=fcgpostech.azurecr.io
          kubectl set image deployment/catalog-worker catalog-worker=$REGISTRY_URL/catalog-worker:${{ github.sha }}
          kubectl rollout status deployment/catalog-worker --timeout=120s
